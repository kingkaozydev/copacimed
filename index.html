    <style>
        body {
            background-color: #ffffff;
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),

            background-size: 30px 30px, 100% 100%, cover;
            background-position: top left, top left, center center;
            background-attachment: fixed;
            color: #000;
            overflow-x: hidden;
            margin: 0;
        }

        .comic-border {
            border: 4px solid #000;
            border-radius: 12px;
        }

        /* Marquee Corrigido */
        .marquee-wrapper {
            display: flex;
            overflow: hidden;
            user-select: none;
            gap: 4rem;
            background: #fff;
            border-top: 4px solid #000;
            border-bottom: 4px solid #000;
            padding: 15px 0;
        }

        .marquee-group {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 4rem;
            min-width: 100%;
            animation: scroll 30s linear infinite;
        }

        @keyframes scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.08) rotate(2deg); }
        }
        
        .floating-badge {
            animation: pulse-soft 3s infinite ease-in-out;
        }

        .subathon-text {
            background: linear-gradient(to bottom, #ffffff 30%, #ffcc00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 4px black;
            filter: drop-shadow(8px 8px 0px #000) drop-shadow(12px 12px 0px #009739);

        /* Estilização do Selo Motorhome */
        .motorhome-label {

            box-shadow: 6px 6px 0px #000;

            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            position: relative;
            overflow: hidden;
        }
        
        .copa-badge::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
    </style>
</head>
