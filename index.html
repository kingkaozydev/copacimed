<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JonVlogs | Subathon Copa do Mundo 🏆</title>
    
    <!-- Imports (React, Tailwind, Babel) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts para o visual cartunesco e assinatura -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Permanent+Marker&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        russo: ['"Russo One"', 'sans-serif'],
                        marker: ['"Permanent Marker"', 'cursive'],
                    },
                    colors: {
                        jvYellow: '#ffcc00',
                        jvGrey: '#cccccc',
                        jvDarkGrey: '#888888',
                        cimedBlue: '#003399',
                        cimedYellow: '#FFDE00'
                    },
                    boxShadow: {
                        'comic': '6px 6px 0px #000000',
                        'comic-lg': '10px 10px 0px #000000',
                        'comic-hover': '3px 3px 0px #000000',
                    }
                }
            }
        };
    </script>

    <style>
        body {
            /* Fundo branco limpo com textura subtil de comic book */
            background-color: #ffffff;
            background-image: radial-gradient(#e5e7eb 2px, transparent 2px);
            background-size: 30px 30px;
            background-attachment: fixed;
            color: #000;
            overflow-x: hidden;
            margin: 0;
        }

        /* Scrollbar customizada estilo comic */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #e5e7eb; border-left: 3px solid #000; }
        ::-webkit-scrollbar-thumb { background: #ffcc00; border-left: 3px solid #000; border-bottom: 3px solid #000; }

        .comic-border {
            border: 4px solid #000;
            border-radius: 12px;
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            border-top: 4px solid #000;
            border-bottom: 4px solid #000;
            background: #fff;
            padding: 10px 0;
            display: flex;
        }

        .marquee-content {
            display: flex;
            animation: marquee 20s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Efeito de glitch/shake leve para o timer */
        @keyframes pulse-timer {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-timer {
            animation: pulse-timer 2s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>

</html>
