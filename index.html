<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JonVlogs | Subathon Copa do Mundo 🏆</title>
    
    <!-- Imports (React, Tailwind, Babel) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts para o visual cartunesco e assinatura -->
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Permanent+Marker&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        russo: ['"Russo One"', 'sans-serif'],
                        marker: ['"Permanent Marker"', 'cursive'],
                    },
                    colors: {
                        jvYellow: '#ffcc00',
                        jvGrey: '#cccccc',
                        jvDarkGrey: '#888888',
                        cimedBlue: '#003399',
                        cimedYellow: '#FFDE00'
                    },
                    boxShadow: {
                        'comic': '6px 6px 0px #000000',
                        'comic-lg': '10px 10px 0px #000000',
                        'comic-hover': '3px 3px 0px #000000',
                    }
                }
            }
        };
    </script>

    <style>
        body {
            background-color: #e5e7eb;
            background-image: radial-gradient(#9ca3af 2px, transparent 2px);
            background-size: 30px 30px;
            color: #000;
            overflow-x: hidden;
            margin: 0;
        }

        /* Scrollbar customizada estilo comic */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #e5e7eb; border-left: 3px solid #000; }
        ::-webkit-scrollbar-thumb { background: #ffcc00; border-left: 3px solid #000; border-bottom: 3px solid #000; }

        .comic-border {
            border: 4px solid #000;
            border-radius: 12px;
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            border-top: 4px solid #000;
            border-bottom: 4px solid #000;
            background: #fff;
            padding: 10px 0;
            display: flex;
        }

        .marquee-content {
            display: flex;
            animation: marquee 20s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Efeito de glitch/shake leve para o timer */
        @keyframes pulse-timer {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .animate-timer {
            animation: pulse-timer 2s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Ícones SVG Inline
        const KickIcon = () => (
            <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6">
                <path d="M5.617 2.378h4.63v4.63h-4.63v-4.63Zm4.63 4.63h4.63v4.629h-4.63V7.008Zm4.63 4.629h4.629v4.63h-4.63v-4.63Zm-4.63 4.63h4.63v4.629h-4.63v-4.629Zm-4.63-4.63h4.63v4.63h-4.63v-4.63Z" />
            </svg>
        );

        const TrophyIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
            </svg>
        );

        // Logo Cimed Placeholder
        const CimedLogo = () => (
            <div className="flex items-center gap-1">
                <div className="bg-cimedBlue text-white font-black italic px-2 py-1 tracking-tighter border-2 border-black -skew-x-12">
                    CIMED
                </div>
            </div>
        );

        const App = () => {
            const [timeLeft, setTimeLeft] = useState(360000); // 100 horas em segundos
            const [subs, setSubs] = useState(45230);
            const goal = 50000;

            // Timer regressivo simulado
            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => prev > 0 ? prev - 1 : 0);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            // Simulação de ganho de subs
            useEffect(() => {
                const subInterval = setInterval(() => {
                    if (Math.random() > 0.5) {
                        setSubs(prev => prev + Math.floor(Math.random() * 3));
                        setTimeLeft(prev => prev + 300); // Adiciona 5 min por sub
                    }
                }, 4000);
                return () => clearInterval(subInterval);
            }, []);

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const progressPercentage = Math.min((subs / goal) * 100, 100);

            return (
                <div className="min-h-screen flex flex-col font-sans relative">
                    
                    {/* Header Principal */}
                    <header className="bg-jvYellow comic-border border-x-0 border-t-0 z-20 sticky top-0 shadow-comic flex items-center justify-between px-4 md:px-8 py-3">
                        <div className="flex items-center gap-4">
                            <h1 className="font-marker text-3xl md:text-5xl transform -rotate-2 drop-shadow-[2px_2px_0px_#fff]">
                                jon<span className="text-white drop-shadow-[2px_2px_0px_#000]">vlogs</span>
                            </h1>
                            <div className="hidden md:flex items-center gap-2 bg-white px-3 py-1 comic-border rounded-full shadow-comic-hover">
                                <span className="font-bold text-xs uppercase">Apoio Oficial:</span>
                                <CimedLogo />
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            <div className="bg-green-500 comic-border px-4 py-1.5 shadow-comic-hover transform rotate-1 hidden md:block">
                                <span className="font-russo text-white tracking-widest text-sm drop-shadow-[1px_1px_0px_#000]">AO VIVO AGORA</span>
                            </div>
                            <button className="bg-black text-jvYellow comic-border px-4 py-2 font-russo uppercase hover:bg-gray-800 transition-colors shadow-comic-hover flex items-center gap-2">
                                <KickIcon /> Assistir na Kick
                            </button>
                        </div>
                    </header>

                    {/* Área Central (Subathon Banner + Player/Chat) */}
                    <main className="flex-1 flex flex-col p-4 md:p-6 gap-6 max-w-[1800px] mx-auto w-full">
                        
                        {/* Banner Subathon */}
                        <section className="bg-white comic-border shadow-comic-lg flex flex-col md:flex-row items-stretch overflow-hidden relative">
                            {/* Background Pattern */}
                            <div className="absolute inset-0 opacity-5 pointer-events-none" style={{ backgroundImage: 'radial-gradient(#000 2px, transparent 2px)', backgroundSize: '15px 15px' }}></div>
                            
                            {/* Info Left */}
                            <div className="p-6 md:w-1/3 flex flex-col justify-center border-b-4 md:border-b-0 md:border-r-4 border-black relative z-10 bg-jvGrey">
                                <div className="flex items-center gap-3 mb-2">
                                    <TrophyIcon />
                                    <h2 className="font-russo text-xl md:text-2xl uppercase tracking-wide">Destino: <span className="text-green-700">Brasil</span></h2>
                                </div>
                                <h3 className="font-black text-3xl md:text-5xl uppercase leading-none mb-4">
                                    Subathon<br/>Copa do Mundo
                                </h3>
                                <p className="font-bold text-sm bg-jvYellow inline-block px-2 py-1 comic-border self-start shadow-comic-hover transform -rotate-1">
                                    A cada SUB ganhe +5 MINUTOS!
                                </p>
                            </div>

                            {/* Timer Center */}
                            <div className="p-6 md:w-1/3 flex flex-col items-center justify-center bg-black text-white relative z-10 border-b-4 md:border-b-0 md:border-r-4 border-black">
                                <span className="font-russo text-jvYellow text-lg tracking-widest mb-2">TEMPO RESTANTE</span>
                                <div className="font-russo text-5xl md:text-7xl animate-timer drop-shadow-[4px_4px_0px_#ffcc00] text-center">
                                    {formatTime(timeLeft)}
                                </div>
                            </div>

                            {/* Goal Right */}
                            <div className="p-6 md:w-1/3 flex flex-col justify-center relative z-10 bg-white">
                                <div className="flex justify-between items-end mb-2">
                                    <span className="font-russo text-lg uppercase">Meta de Inscrições</span>
                                    <span className="font-black text-2xl">{subs.toLocaleString()} / {goal.toLocaleString()}</span>
                                </div>
                                <div className="w-full h-8 bg-gray-200 comic-border overflow-hidden relative shadow-inner">
                                    <div 
                                        className="h-full bg-jvYellow border-r-4 border-black transition-all duration-500 ease-out"
                                        style={{ width: `${progressPercentage}%` }}
                                    ></div>
                                    <div className="absolute inset-0 flex items-center justify-center font-bold text-xs uppercase mix-blend-difference text-white">
                                        Rumo aos jogos do Brasil!
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Player e Chat Container */}
                        <section className="flex flex-col lg:flex-row gap-6 h-[600px] lg:h-[700px] w-full">
                            
                            {/* Player Wrapper */}
                            <div className="flex-1 lg:w-3/4 bg-black comic-border shadow-comic-lg flex flex-col relative group">
                                <div className="bg-jvGrey border-b-4 border-black px-4 py-2 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <div className="w-3 h-3 rounded-full bg-red-500 border-2 border-black animate-pulse"></div>
                                        <span className="font-russo text-sm uppercase tracking-wider">JonVlogs Transmissão Oficial</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <div className="w-4 h-4 rounded-full bg-white border-2 border-black"></div>
                                        <div className="w-4 h-4 rounded-full bg-white border-2 border-black"></div>
                                    </div>
                                </div>
                                <div className="flex-1 w-full bg-black relative">
                                    {/* Embed da Kick (Player) */}
                                    <iframe 
                                        src="https://player.kick.com/jonvlogs?autoplay=true" 
                                        className="absolute top-0 left-0 w-full h-full border-none" 
                                        allowFullScreen>
                                    </iframe>
                                </div>
                            </div>

                            {/* Chat Wrapper */}
                            <div className="w-full lg:w-1/4 h-[400px] lg:h-full bg-white comic-border shadow-comic-lg flex flex-col flex-shrink-0">
                                <div className="bg-jvYellow border-b-4 border-black px-4 py-2 flex items-center justify-between">
                                    <span className="font-russo text-sm uppercase tracking-wider">Chat da Kick</span>
                                    <KickIcon />
                                </div>
                                <div className="flex-1 w-full bg-[#0b0e11] relative overflow-hidden">
                                    {/* Embed da Kick (Chat) */}
                                    <iframe 
                                        src="https://kick.com/popout/jonvlogs/chat" 
                                        className="absolute top-0 left-0 w-full h-full border-none"
                                        referrerPolicy="no-referrer"
                                        allow="clipboard-write">
                                    </iframe>
                                </div>
                            </div>

                        </section>

                    </main>

                    {/* Footer / Sponsor Marquee */}
                    <footer className="mt-8">
                        <div className="marquee-container shadow-comic-lg bg-white">
                            <div className="marquee-content gap-12 items-center px-4">
                                {/* Duplicando para efeito infinito contínuo */}
                                {[1, 2, 3].map((_, i) => (
                                    <React.Fragment key={i}>
                                        <span className="font-russo text-2xl uppercase tracking-widest text-black">SUPERBET</span>
                                        <span className="font-marker text-3xl mx-4">jonvlogs</span>
                                        <span className="font-russo text-2xl uppercase tracking-widest text-green-500 drop-shadow-[1px_1px_0px_#000]">KICK</span>
                                        <CimedLogo />
                                        <span className="font-russo text-2xl uppercase tracking-widest text-black">DRINKISS</span>
                                        <span className="font-russo text-2xl uppercase tracking-widest text-black">BGAMING</span>
                                        <span className="font-russo text-2xl uppercase tracking-widest text-black">KEYDROP</span>
                                    </React.Fragment>
                                ))}
                            </div>
                        </div>
                        <div className="text-center py-6 bg-jvGrey border-t-4 border-black">
                            <p className="font-bold text-sm uppercase text-black/70">
                                © 2026 JonVlogs. Arte & Subathon Rumo à Copa do Mundo. Patrocínio Cimed.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
