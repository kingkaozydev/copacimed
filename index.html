<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jonvlogs | Subathon Copa do Mundo 🏆💊</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Russo+One&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        display: ['"Russo One"', 'sans-serif'],
                    },
                    colors: {
                        cimed: {
                            DEFAULT: '#FFCC00',
                            dark: '#D9AD00',
                            light: '#FFE066'
                        },
                        kick: '#53fc18',
                        brazil: {
                            green: '#009b3a',
                            blue: '#002776',
                            yellow: '#fedf00'
                        },
                        dark: '#050507',
                        surface: '#121215'
                    },
                    animation: {
                        'marquee': 'marquee 30s linear infinite',
                        'float': 'float 4s ease-in-out infinite',
                        'float-delayed': 'float 4s ease-in-out 2s infinite',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite alternate',
                        'spin-slow': 'spin 12s linear infinite',
                        'drive': 'drive 20s linear infinite',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' }
                        },
                        pulseGlow: {
                            '0%': { filter: 'drop-shadow(0 0 10px rgba(255,204,0,0.4))' },
                            '100%': { filter: 'drop-shadow(0 0 30px rgba(255,204,0,0.9))' }
                        },
                        drive: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '100%': { backgroundPosition: '100% 50%' }
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body { background-color: #050507; color: #fff; overflow: hidden; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 204, 0, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 204, 0, 0.6); }

        /* Partículas animadas estilo poeira da estrada / faíscas */
        .particles-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1; pointer-events: none;
        }
        .particle {
            position: absolute;
            bottom: -10px;
            width: 4px; height: 4px;
            background-color: #FFCC00;
            border-radius: 50%;
            opacity: 0;
            animation: rise 5s infinite ease-in;
            box-shadow: 0 0 10px #FFCC00, 0 0 20px #FFCC00;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
        }
        
        .road-lines {
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 30vh;
            background: repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(255, 204, 0, 0.1) 100px, rgba(255, 204, 0, 0.1) 200px);
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
            animation: drive 2s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(18, 18, 21, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 204, 0, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .clip-slant {
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ÍCONES SVG ---
        const TrophyIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path fillRule="evenodd" d="M5.166 2.621C4.693 2.502 4.195 2.805 4.09 3.284A10.512 10.512 0 004 5.37v.85c0 1.956.884 3.737 2.308 4.908.75.617 1.636 1.102 2.593 1.411a7.485 7.485 0 00-1.895 4.46h-1.5a.75.75 0 00-.75.75v1.5a.75.75 0 00.75.75h13a.75.75 0 00.75-.75v-1.5a.75.75 0 00-.75-.75h-1.5a7.485 7.485 0 00-1.895-4.46c.957-.309 1.842-.794 2.593-1.411A7.478 7.478 0 0019.99 6.22v-.85a10.512 10.512 0 00-.09-2.086c-.105-.479-.603-.782-1.076-.663A12.015 12.015 0 0112 3a12.015 12.015 0 01-6.834-.379zm1.18 5.614A5.986 5.986 0 015.5 6.22v-.419c.477.067.962.115 1.453.143V8.235zM17.047 5.944c.491-.028.976-.076 1.453-.143v.42a5.986 5.986 0 01-.847 2.015V5.944zM12 17.25a6.002 6.002 0 01-5.69-4.103A10.495 10.495 0 0012 14.25a10.495 10.495 0 005.69-1.103A6.002 6.002 0 0112 17.25z" clipRule="evenodd" />
            </svg>
        );

        const KickIcon = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className}>
                <path d="M5.5 2h3.5v5.5h3.5V2h6v20h-6v-5.5H9V22H5.5V2z"/>
            </svg>
        );

        const CimedIcon = ({ className }) => (
            <svg viewBox="0 0 100 30" fill="currentColor" className={className}>
                <text x="0" y="24" fontFamily="Russo One" fontSize="28" fontWeight="bold">CIMED</text>
            </svg>
        );

        // --- COMPONENTES ---

        // Fita Marquee do topo
        const MarqueeBanner = () => {
            const texts = [
                "🚀 JONVLOGS NA ESTRADA", "🏆 RUMO AO HEXA COPA DO MUNDO", "💊 OFERECIMENTO CIMED", "🔥 SUBATHON INSANO NA KICK",
                "🚀 JONVLOGS NA ESTRADA", "🏆 RUMO AO HEXA COPA DO MUNDO", "💊 OFERECIMENTO CIMED", "🔥 SUBATHON INSANO NA KICK"
            ];
            
            return (
                <div className="bg-cimed text-black overflow-hidden py-1.5 relative z-50 border-b-2 border-cimed-dark">
                    <div className="flex w-[200%] animate-marquee">
                        {texts.map((text, i) => (
                            <div key={i} className="flex-1 text-center font-display text-sm tracking-wider uppercase flex items-center justify-center gap-4">
                                <span>{text}</span>
                                <span className="text-black/30 text-[10px]">♦</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Contador do Subathon
        const SubathonTimer = () => {
            const [time, setTime] = useState(360000); // Exemplo: 100 horas em segundos

            useEffect(() => {
                const timer = setInterval(() => setTime(prev => prev > 0 ? prev - 1 : 0), 1000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (totalSeconds) => {
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            return (
                <div className="flex flex-col items-center justify-center glass-panel px-6 py-2 rounded-2xl relative overflow-hidden group">
                    <div className="absolute inset-0 bg-cimed/10 group-hover:bg-cimed/20 transition-colors"></div>
                    <span className="text-[10px] text-cimed uppercase font-bold tracking-[0.2em] mb-1">Tempo de Subathon</span>
                    <div className="text-4xl font-display text-white tracking-wider flex items-center gap-2 drop-shadow-[0_0_15px_rgba(255,204,0,0.8)]">
                        ⏱️ {formatTime(time)}
                    </div>
                </div>
            );
        };

        // Efeito de Partículas
        const Particles = () => {
            return (
                <div className="particles-container">
                    {[...Array(30)].map((_, i) => (
                        <div 
                            key={i} 
                            className="particle" 
                            style={{
                                left: `${Math.random() * 100}%`,
                                animationDuration: `${3 + Math.random() * 4}s`,
                                animationDelay: `${Math.random() * 5}s`,
                                width: `${Math.random() * 4 + 2}px`,
                                height: `${Math.random() * 4 + 2}px`
                            }}
                        />
                    ))}
                </div>
            );
        };

        // APP PRINCIPAL
        const App = () => {
            return (
                <div className="flex flex-col h-screen relative bg-dark font-sans overflow-hidden">
                    
                    {/* --- BACKGROUND ANIMADO --- */}
                    <div className="absolute inset-0 z-0">
                        {/* Imagem de Fundo (Motorhome / Estrada) - Usando imagem genérica focada em estrada */}
                        <img 
                            src="https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?q=80&w=2070&auto=format&fit=crop" 
                            className="w-full h-full object-cover opacity-20 filter contrast-125"
                            alt="Motorhome Background"
                        />
                        
                        {/* Gradientes e Filtros Cimed */}
                        <div className="absolute inset-0 bg-gradient-to-b from-dark/90 via-dark/60 to-dark/95"></div>
                        <div className="absolute inset-0 bg-gradient-to-tr from-cimed/10 to-transparent mix-blend-overlay"></div>
                        
                        {/* Luz do motorhome / farol animado */}
                        <div className="absolute top-1/4 -left-[200px] w-[600px] h-[600px] bg-cimed/20 blur-[150px] rounded-full mix-blend-screen animate-pulse-glow pointer-events-none"></div>
                        <div className="absolute bottom-0 right-0 w-[800px] h-[400px] bg-brazil-green/10 blur-[150px] rounded-full mix-blend-screen pointer-events-none"></div>

                        {/* Efeito da estrada em movimento */}
                        <div className="road-lines"></div>
                        <Particles />
                    </div>

                    {/* --- CABEÇALHO --- */}
                    <div className="z-20 relative flex flex-col">
                        <MarqueeBanner />
                        
                        <header className="px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4 glass-panel border-b-0 border-cimed/30">
                            
                            {/* Logo / Título */}
                            <div className="flex items-center gap-4">
                                <div className="relative">
                                    <div className="absolute inset-0 bg-cimed blur-xl opacity-30 rounded-full animate-pulse-glow"></div>
                                    <img 
                                        src="https://decapi.me/kick/avatar/jonvlogs" 
                                        alt="Jonvlogs" 
                                        className="w-16 h-16 rounded-full border-2 border-cimed object-cover relative z-10 shadow-[0_0_20px_rgba(255,204,0,0.5)]"
                                        onError={(e) => { e.target.src = 'https://ui-avatars.com/api/?name=Jon+Vlogs&background=FFCC00&color=000'; }}
                                    />
                                </div>
                                <div className="flex flex-col">
                                    <div className="flex items-center gap-2">
                                        <h1 className="text-2xl md:text-3xl font-display text-white italic tracking-wide drop-shadow-md">
                                            JONVLOGS
                                        </h1>
                                        <span className="bg-kick text-black text-[10px] font-bold px-2 py-0.5 rounded uppercase flex items-center gap-1">
                                            <KickIcon className="w-3 h-3" /> Ao Vivo
                                        </span>
                                    </div>
                                    <p className="text-cimed text-sm font-bold flex items-center gap-1.5">
                                        <TrophyIcon className="w-4 h-4 text-cimed animate-float" />
                                        SUBATHON COPA DO MUNDO
                                    </p>
                                </div>
                            </div>

                            {/* Patrocinador Central & Timer */}
                            <div className="flex items-center gap-8">
                                <div className="hidden lg:flex flex-col items-center group cursor-pointer animate-float-delayed">
                                    <span className="text-[8px] text-gray-400 uppercase tracking-widest mb-1">Apresentado por</span>
                                    <div className="bg-cimed text-black px-6 py-2 rounded-xl border border-white/20 shadow-[0_0_30px_rgba(255,204,0,0.4)] group-hover:scale-105 transition-transform flex items-center gap-2">
                                        <CimedIcon className="w-20 h-auto" />
                                        {/* Espaço para adicionar produto da cimed futuramente na imagem */}
                                    </div>
                                </div>
                                
                                <SubathonTimer />
                            </div>
                        </header>
                    </div>

                    {/* --- ÁREA PRINCIPAL (PLAYER + CHAT) --- */}
                    <main className="flex-1 z-20 relative p-4 lg:p-6 flex flex-col lg:flex-row gap-6 min-h-0">
                        
                        {/* Container do Vídeo (Esquerda - 70%) */}
                        <div className="flex-1 flex flex-col min-h-0 bg-black/60 rounded-[2rem] border border-cimed/20 shadow-[0_0_50px_rgba(0,0,0,0.8)] overflow-hidden relative group backdrop-blur-sm">
                            
                            {/* Barra decorativa superior do player */}
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cimed via-kick to-brazil-green z-50"></div>
                            
                            {/* Botão flutuante de patrocinador no canto do player (estilo overlay) */}
                            <div className="absolute top-4 left-4 z-50 glass-panel px-3 py-1.5 rounded-lg flex items-center gap-2 pointer-events-none border border-cimed/30">
                                <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                                <span className="text-xs font-bold text-white shadow-black drop-shadow-md">Motorhome Cimed</span>
                            </div>

                            <iframe 
                                src="https://player.kick.com/jonvlogs?autoplay=true" 
                                className="w-full h-full border-0 relative z-10" 
                                allowFullScreen 
                                title="Jonvlogs Kick Player"
                            ></iframe>
                        </div>

                        {/* Container do Chat (Direita - 30%) */}
                        <div className="w-full lg:w-[400px] flex flex-col min-h-0 bg-[#0b0e11]/90 rounded-[2rem] border border-white/10 shadow-2xl overflow-hidden backdrop-blur-xl relative">
                            {/* Header do Chat */}
                            <div className="px-4 py-3 bg-surface/80 border-b border-white/10 flex items-center justify-between shrink-0">
                                <div className="flex items-center gap-2">
                                    <KickIcon className="w-5 h-5 text-kick" />
                                    <span className="font-bold text-white text-sm">Chat ao vivo</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="bg-cimed/20 text-cimed border border-cimed/30 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">
                                        #CimedNaCopa
                                    </span>
                                </div>
                            </div>
                            
                            {/* Iframe do Chat Kick */}
                            <div className="flex-1 relative bg-[#0b0e11]">
                                <iframe 
                                    src="https://kick.com/popout/jonvlogs/chat" 
                                    className="w-full h-full border-0"
                                    title="Jonvlogs Kick Chat"
                                ></iframe>
                            </div>
                        </div>

                    </main>

                    {/* --- RODAPÉ DE PATROCINADORES / IMAGENS --- */}
                    <div className="h-20 lg:h-24 shrink-0 z-20 glass-panel border-t border-cimed/20 flex items-center justify-center px-4 overflow-hidden relative">
                        <div className="absolute inset-0 bg-gradient-to-r from-dark via-transparent to-dark z-10 pointer-events-none"></div>
                        <div className="flex gap-8 items-center opacity-60 hover:opacity-100 transition-opacity justify-center w-full max-w-5xl">
                            {/* Slots de Patrocinadores (onde o usuário vai inserir as imagens depois) */}
                            <div className="h-12 w-32 bg-white/5 rounded-lg border border-white/10 flex items-center justify-center relative overflow-hidden group/sponsor">
                                <div className="absolute inset-0 bg-cimed/20 opacity-0 group-hover/sponsor:opacity-100 transition-opacity"></div>
                                <span className="text-[10px] font-bold text-white/50 uppercase tracking-widest">Patrocinador 1</span>
                            </div>
                            <div className="h-12 w-32 bg-white/5 rounded-lg border border-white/10 flex items-center justify-center relative overflow-hidden group/sponsor">
                                <div className="absolute inset-0 bg-cimed/20 opacity-0 group-hover/sponsor:opacity-100 transition-opacity"></div>
                                <span className="text-[10px] font-bold text-white/50 uppercase tracking-widest">Patrocinador 2</span>
                            </div>
                            <div className="hidden md:flex h-12 w-32 bg-white/5 rounded-lg border border-white/10 items-center justify-center relative overflow-hidden group/sponsor">
                                <div className="absolute inset-0 bg-cimed/20 opacity-0 group-hover/sponsor:opacity-100 transition-opacity"></div>
                                <span className="text-[10px] font-bold text-white/50 uppercase tracking-widest">Patrocinador 3</span>
                            </div>
                            <div className="h-12 w-48 bg-cimed/10 rounded-lg border border-cimed/30 flex items-center justify-center relative overflow-hidden group/sponsor">
                                <div className="absolute inset-0 bg-cimed/20 opacity-0 group-hover/sponsor:opacity-100 transition-opacity"></div>
                                <CimedIcon className="w-16 h-auto text-cimed" />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
